<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3E8D5">
<title>المعلقات — بوابة مسار</title>
<link rel="stylesheet" href="css/muallaqat.css">
</head>
<body>
<header class="topbar">
  <div class="topin">
    <a class="brand" href="../index.html"><span class="brandmark">م</span><span class="brandtext"><b>مسار</b><span>المكتبة الأدبية</span></span></a>
    <span class="pageCrumb">المعلقات</span>
    <span class="spacer"></span>
    <label class="poetPicker" aria-label="اختيار الشاعر"><span>الشاعر</span><select id="poetSelect"></select></label>
    <button class="iconbtn" id="themeBtn" aria-label="تبديل الثيم">◐</button>
  </div>
</header>
<main class="wrap">
  <section class="hero cleanHero">
    <div class="heroTitle">
      <div><span class="kicker" id="poemType">معلقة</span><h1 id="poetName">المعلقات</h1><p class="opening" id="openingLine">جاري تحميل القصيدة…</p></div>
      <div class="metaLine" id="metaLine"></div>
    </div>
    <details class="textInfo"><summary>عن النص والرواية</summary><div class="textInfoBody" id="textInfoBody"></div></details>
  </section>
  <section class="tools">
    <label class="search">⌕ <input id="search" type="search" placeholder="ابحث في بيت، كلمة، أو معنى…" autocomplete="off"></label>
    <div class="actions"><button class="pillbtn compactBtn" id="fontBtn" title="تغيير حجم الأبيات">أ+</button></div>
  </section>
  <div class="sectionMeta cleanSections"><b>المقاطع</b><em>اسحب للتنقل ←</em></div>
  <div class="sectionsWrap"><nav class="sections" id="sections"></nav></div>
  <div class="progressbox cleanProgress"><div class="progress"><i id="progressBar"></i></div><span id="progressLabel">٠٪</span></div>
  <div class="loadState" id="loadState">جاري تحميل القصيدة…</div>
  <section class="poem" id="poem"></section>
  <div class="empty" id="empty">لا توجد نتائج مطابقة.</div>
  <div class="footer">المعلقات • مسار</div>
</main>
<button class="fab" id="topBtn" aria-label="أعلى الصفحة">↑</button>
<script src="js/muallaqat.js" defer></script>
</body>
</html>
