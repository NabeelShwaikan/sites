<body><div class="wrap">
<header><div class="brand"><div class="logo" aria-hidden="true">لـ</div><div><div class="eyebrow" id="brandText">مسار • وقت للتحدّي</div><h1 id="title">تحدّي الكلمات</h1></div></div><div class="top-actions"><button id="openSettings" class="settings-button" type="button" aria-haspopup="dialog" aria-controls="settingsDialog">⚙ الإعدادات</button><button id="uiLang" class="icon" aria-label="English interface">EN</button><button id="theme" class="icon" aria-label="تبديل المظهر">◐</button><button id="fullscreen" class="icon" aria-label="ملء الشاشة">⛶</button></div></header>
<main class="layout"><section class="panel game" aria-labelledby="title"><div class="game-head"><span class="pill" id="roundLabel"></span><span id="turnLabel"></span><span class="timer"><span aria-hidden="true">◷</span><b id="clock">—</b></span></div><p class="level-note" id="activeConfig" style="text-align:center"></p><div class="track"><div class="fill" id="fill"></div></div><div class="board" id="board" role="group" aria-label="محاولات تخمين الكلمة"></div><div class="message" id="message" role="status" aria-live="polite"></div><form class="entry" id="entry"><input id="guess" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="الكلمة المقترحة"><button type="submit" class="primary" id="submit">تحقّق</button></form><div class="keyboard" id="keyboard" aria-label="لوحة الحروف"></div><div class="legend" id="legend"></div><div class="game-actions"><button id="pause" disabled>إيقاف مؤقت</button><button id="subtractTime">−١٥ ث</button><button id="addTime">+١٥ ث</button><button id="next" class="primary">ابدأ الجولة</button></div></section>
<aside class="side"><section class="panel scorebox"><h2 id="scoreTitle">لوحة النقاط</h2><div class="scores" id="scores"></div><div class="stats"><span id="wins"></span><span id="best"></span></div></section></aside></main></div>
<dialog class="panel settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle"><div class="modal-head"><h2 id="settingsTitle">إعداد التحدّي</h2><button id="closeSettings" class="icon" type="button" aria-label="إغلاق الإعدادات">×</button></div><section class="settings"><div class="fields"><div class="field"><label for="wordLang" id="wordLangLabel">لغة الكلمات</label><select id="wordLang"><option value="ar">العربية</option><option value="en">English</option></select></div><div class="field"><label for="mode" id="modeLabel">طريقة اللعب</label><select id="mode"><option value="solo">فردي</option><option value="teams">فريقان</option></select></div><div class="field"><label for="wordLength" id="wordLengthLabel">عدد الأحرف</label><select id="wordLength"><option value="5" selected>٥ أحرف</option></select></div></div><p class="level-note" id="levelNote"></p><label class="check"><input type="checkbox" id="revealFirst" checked><span id="revealFirstLabel">كشف الحرف الأول</span></label><div class="timing"><div class="pair"><div class="field"><label for="timerMode" id="timerModeLabel">نوع المؤقت</label><select id="timerMode"><option value="none" selected>لعب حر دون مؤقت</option><option value="round">للجولة</option><option value="attempt">لكل محاولة</option></select></div><div class="field"><label for="duration" id="durationLabel">المدة بالثواني</label><input id="duration" type="number" min="5" max="600" step="1" value="90"></div></div><div class="presets" id="presets"><button type="button" data-time="15">15</button><button type="button" data-time="30">30</button><button type="button" data-time="60">60</button><button type="button" data-time="90">90</button><button type="button" data-time="120">120</button><button type="button" data-time="180">180</button></div></div><label class="check"><input type="checkbox" id="sound"><span id="soundLabel">المؤثرات الصوتية</span></label><div class="audio-controls"><label for="volume" id="volumeLabel">مستوى الصوت</label><input id="volume" type="range" min="0" max="100" value="35"><button type="button" id="testSound">تجربة</button></div><label class="check"><input type="checkbox" id="strict"><span id="strictLabel">اقبل كلمات البنك فقط</span></label><button class="primary" id="reset">تحدٍّ جديد</button><p class="small" id="usedNote" aria-live="polite"></p><button type="button" id="clearUsed" style="width:100%;margin-top:12px">مسح الكلمات المستخدمة</button></section></dialog>
<dialog class="panel meaning-dialog" id="meaningDialog" aria-labelledby="meaningWord" aria-describedby="meaningArabic"><button id="closeMeaning" class="meaning-close icon" type="button" aria-label="إغلاق">×</button><h2 id="meaningWord" lang="en" dir="ltr"></h2><p id="meaningArabic" lang="ar" dir="rtl"></p><button type="button" class="primary" id="meaningNext">الكلمة التالية</button></dialog>

$('entry').addEventListener('submit',e=>{e.preventDefault();submit();});function syncInput(e){if(e.isComposing||!active||paused||finished)return;typed=normalize($('guess').value,cfg.lang).slice(0,cfg.len);$('guess').value=typed;renderBoard();}$('guess').addEventListener('input',syncInput);$('guess').addEventListener('compositionend',syncInput);document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,select,button,summary'))return;if(!active||paused||$('meaningDialog').open||$('settingsDialog').open)return;if(e.key==='Enter'){e.preventDefault();submit();}else if(e.key==='Backspace'){e.preventDefault();press('DELETE');}else {const k=normalize(e.key,cfg.lang);if(k.length===1&&(cfg.lang==='ar'?/^[ء-ي]$/:/^[A-Z]$/).test(k)){e.preventDefault();press(k);}}});$('reset').onclick=()=>{if(newChallenge())$('settingsDialog').close();};$('next').onclick=()=>{if(finished){if(cfg.mode==='teams')turn=1-turn;setupRound(true);}else{active=started=true;markUsed();render();runClock();sound('start');}};$('pause').onclick=()=>{if(!active)return;if(paused){paused=false;runClock();}else{tick();if(finished)return;paused=true;stopClock();}render();sound('pause');};function switchLanguage(lang){const duration=Number($('duration').value);if($('timerMode').value!=='none'&&(!Number.isInteger(duration)||duration<5||duration>600)){$('wordLang').value=cfg.lang;setMessage(t('timeRange'),true);$('duration').focus();return;}ui=lang;$('wordLang').value=lang;newChallenge();translate();}$('uiLang').onclick=()=>switchLanguage(ui==='ar'?'en':'ar');$('wordLang').addEventListener('change',()=>switchLanguage($('wordLang').value));$('theme').onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('masar.lingo.theme.v1',theme);}catch{}};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.body.classList.toggle('presentation');}};for(const id of ['mode','duration','strict','timerMode'])$(id).addEventListener('change',updateBankNote);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});$('wordLength').addEventListener('change',updateBankNote);$('revealFirst').addEventListener('change',updateBankNote);$('addTime').onclick=()=>changeTime(15);$('subtractTime').onclick=()=>changeTime(-15);for(const b of $('presets').querySelectorAll('button'))b.onclick=()=>{$('duration').value=b.dataset.time;updateBankNote();};$('sound').onchange=()=>{if($('sound').checked){try{if(!initAudio()){setMessage(t('soundUnavailable'),true);$('sound').checked=false;}}catch{$('sound').checked=false;}sound('start');}else silence();try{localStorage.setItem('masar.lingo.sound.v1',$('sound').checked?'1':'0');}catch{}};$('testSound').onclick=()=>{$('sound').checked=true;$('sound').dispatchEvent(new Event('change'));};$('volume').oninput=()=>{try{localStorage.setItem('masar.lingo.volume.v1',$('volume').value);}catch{}};try{$('sound').checked=localStorage.getItem('masar.lingo.sound.v1')==='1';const volume=localStorage.getItem('masar.lingo.volume.v1');if(volume!==null)$('volume').value=String(Math.min(100,Math.max(0,Number(volume)||0)));}catch{}document.addEventListener('pointerdown',()=>{if($('sound').checked){try{initAudio();}catch{}}});$('clearUsed').onclick=()=>{usedWords={};lastInitial={};saveUsed();updateBankNote();setMessage(t('historyCleared'));};let learningTimer=null;
function showMeaning(word){$('meaningWord').textContent=ENGLISH_DISPLAY[word]||word.toLowerCase();$('meaningArabic').textContent=ENGLISH_MEANINGS[word];$('meaningNext').textContent=ui==='ar'?'الكلمة التالية':'Next word';$('closeMeaning').setAttribute('aria-label',ui==='ar'?'إغلاق':'Close');$('meaningDialog').showModal();}
$('closeMeaning').onclick=()=>$('meaningDialog').close();$('meaningNext').onclick=()=>{$('meaningDialog').close();$('next').click();};$('meaningDialog').addEventListener('close',()=>{$('next').focus();});
let settingsAutoPaused=false;$('openSettings').onclick=()=>{settingsAutoPaused=active&&!paused;if(settingsAutoPaused)$('pause').click();$('settingsDialog').showModal();document.body.classList.add('modal-open');};$('closeSettings').onclick=()=>$('settingsDialog').close();$('settingsDialog').addEventListener('close',()=>{document.body.classList.remove('modal-open');if(settingsAutoPaused&&active&&paused)$('pause').click();settingsAutoPaused=false;$('openSettings').focus();});$('settingsDialog').addEventListener('click',e=>{if(e.target!==$('settingsDialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();});$('timerMode').value='none';translate();newChallenge();
